
      - name: Install AIDL
        run: |
          sdkmanager --install "build-tools;35.0.0"
          AIDL_PATH=$(find "$ANDROID_HOME/build-tools" -type f -name aidl | head -n 1)
          if [ -z "$AIDL_PATH" ]; then
            echo "AIDL not found"
            exit 1
          fi
          echo "$(dirname "$AIDL_PATH")" >> "$GITHUB_PATH"
          chmod +x "$AIDL_PATH"
          "$AIDL_PATH" --version
